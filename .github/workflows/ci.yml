name: Tests, benchmark & fuzz

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_typecheck_gate:
        description: Run the curated typing-lint baseline trial
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
      - name: Run docstring lint
        run: ruff check --select D \
          src/language_server.py \
          src/language_server_cli.py \
          src/tiny_language_cli.py \
          src/tiny_language_api.py \
          src/tiny_errors.py
      - name: Run formatter/lint gate
        run: python tools/check_format_lint.py
      - name: Run LSP workflow tests
        run: |
          python -m pytest \
            tests/detailtests/test_language_server.py \
            tests/detailtests/test_language_server_cli.py \
            tests/detailtests/test_tiny_language_server_cli_self_host.py
      - name: Run release-candidate checklist gate
        run: python tools/release/check_release_candidate_checklist.py
      - name: Run performance budget gate
        run: python tools/performance/check_performance_budgets.py
      - name: Run pytest suite
        run: python -m pytest --assert-no-heap-leaks
      - name: Build unsigned release artifacts
        run: python tools/release/build_release_artifacts.py --output-dir dist/release-ci

  typecheck-gate-trial:
    if: github.event_name == 'workflow_dispatch' && inputs.run_typecheck_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run curated typecheck gate
        run: python tools/typecheck_ci_gate.py
      - name: Publish typecheck baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-baseline-report
          path: artifacts/ci/typecheck-baseline.json
          if-no-files-found: error
