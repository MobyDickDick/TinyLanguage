name: Tests, benchmark & fuzz

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_typecheck_gate:
        description: Run the curated typing-lint baseline trial
        required: false
        default: false
        type: boolean

jobs:
  platform:
    name: Platform / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-24.04
            machine: x86_64
          - os: windows-2022
            machine: x86_64
          - os: macos-15-intel
            machine: x86_64
          - os: macos-15
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Require the promised CPU architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: python -c "import os, platform; machine = platform.machine().lower(); machine = {'amd64':'x86_64', 'aarch64':'arm64'}.get(machine, machine); assert machine == os.environ['EXPECTED_MACHINE'], machine"
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
      - name: Install Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure Windows linker and SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify macOS compiler
        if: runner.os == 'macOS'
        run: xcrun --find clang
      - name: Require a working compiler
        run: clang --version
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run platform regression suite with required backend execution
        run: python -m pytest --require-backend-toolchains -ra --junitxml=artifacts/platform-tests.xml
      - name: Build the current source wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist/platform
      - name: Qualify a fresh installation outside the checkout
        shell: bash
        run: python tools/release/verify_installed_workflows.py dist/platform/*.whl --require-compiler --report artifacts/platform-install.json
      - name: Retain platform acceptance evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: platform-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            artifacts/platform-tests.xml
            artifacts/platform-install.json
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt ruff
      - name: Run docstring lint
        run: |
          files=""
          for path in \
            "src/language_server.py" \
            "src/language_server_cli.py" \
            "src/tiny_language_cli.py" \
            "src/tiny_language_api.py" \
            "src/tiny_errors.py"; do
            if [ -f "$path" ]; then
              files="$files $path"
            fi
          done
          if [ -n "$files" ]; then
            ruff check --select D $files
          fi
      - name: Run formatter/lint gate
        run: python tools/check_format_lint.py
      - name: Run LSP workflow tests
        run: |
          python -m pytest \
            tests/detailtests/test_language_server.py \
            tests/detailtests/test_language_server_cli.py \
            tests/detailtests/test_tiny_language_server_cli_self_host.py
      - name: Run release-candidate checklist gate
        run: python tools/release/check_release_candidate_checklist.py
      - name: Run performance budget gate
        run: python tools/performance/check_performance_budgets.py
      - name: Run pytest suite
        run: python -m pytest --assert-no-heap-leaks
      - name: Build unsigned release artifacts
        run: python tools/release/build_release_artifacts.py --output-dir dist/release-ci

  typecheck-gate-trial:
    if: github.event_name == 'workflow_dispatch' && inputs.run_typecheck_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run curated typecheck gate
        run: python tools/typecheck_ci_gate.py
      - name: Publish typecheck baseline report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: typecheck-baseline-report
          path: artifacts/ci/typecheck-baseline.json
          if-no-files-found: error
